# Derived from .memlog.md by bmad-spec Story Breakdown, 2026-08-02.
# Execution order is list order. Ids per assets/stories-schema.md.
- id: "1"
  title: CSV Sources — load, encoding, delimiter, damage detection
  description: >-
    CAP-1 (CSV scope), CAP-2, CAP-3, CAP-39: load CSV files as named removable
    Sources, run the encoding ladder with a visible override, propose delimiter
    and header row correctably, and report structural damage instead of parsing
    a plausible table. Establishes the AD-7 registry (original bytes plus raw
    parsed table) and the SourceReader port with the csv adapter.
  invoke_dev_with: >-
    Parser type coercion is permanently off; typing is Step zero, elsewhere
    (AD-7, conventions). The encoding ladder (BOM, strict UTF-8, Windows-1252)
    lives in core/types, not the adapter — ui/ hands over an ArrayBuffer (AD-3).
- id: "2"
  title: Source preview
  description: >-
    CAP-8, tabular part: every loaded Source shows detected columns and a
    bounded row window whose counts are the Source's totals. The JSON/NDJSON
    structure view is story 17's.
  invoke_dev_with: >-
    Previews render through the same fixed-height row windowing as the Result
    (AD-24, ~50-row window); tables reach ui/ only via shallowRef, never
    reactive state (AD-6).
- id: "3"
  title: Typing as Step zero with confirmation gate, column annotations
  description: >-
    CAP-9, CAP-10: detect type and locale per column over every value, report
    irreducible ambiguity as such, block execution until each Source's mapping
    is confirmed once, and let the user annotate columns into the Recipe.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Detection reads every value, never a sample (CAP-9). Unparsed values become
    boxed cells the TableEngine adapter alone understands (AD-22); dates
    normalize to UTC-midnight epoch nanoseconds held as a BigInt (AD-21);
    native columns still get the missing-value sweep (AD-20). The gate belongs to core/exec, not the UI
    (AD-29), even while the scheduler is still minimal.
- id: "4"
  title: XLSX and Parquet Sources
  description: >-
    CAP-1 remainder except JSON: read .xlsx and Parquet as Sources whose
    readers declare per-column what they delivered (text vs native type), so
    the confirmation gate presents them as pre-typed but still confirmable.
  invoke_dev_with: >-
    SourceReader declares text or native:<type> per column (AD-20).
    read-excel-file 9.3.5 returns [{sheet,data}], not a flat grid, when no
    sheet is named; its own fflate blob-URL workers are permitted — AD-15
    constrains only querbeet's code. This story is the first real consumer of
    the native:<type> branch: story 3 built and tested it, but only against a
    hand-written reader result, because no reader in the tree delivers
    anything but text. core/types/typing.js detectColumn returns a native
    column pre-typed with format null, skips locale inference, and still
    counts missing values — and the confirmation gate still requires a person,
    which is the whole point (AD-20). If a real XLSX column does not fit that
    shape, the assumption is wrong here, not in story 3's tests.
- id: "4a"
  title: Typing reaches the types a report actually holds
  description: >-
    CAP-9 remainder: detection covers datetime, time, boolean and numbers
    carrying an affix, so a timestamp, a margin and an amount stop being text.
    Closes the asymmetry where the same table is typed as XLSX and untyped as
    CSV.
  spec_checkpoint: true
  invoke_dev_with: >-
    Story 3 detects three types — text, number, date — and story 4 gives
    datetime and boolean their words without giving a text column any way to
    reach them. Every type here goes into core/types/catalog.js, the single
    declaration story 4 established, and each becomes settable there rather
    than in a second list. Nothing here converts a value; story 6 still owns
    that (AD-21, AD-22). Six pieces, in the order their risk falls. (1) The
    MAX_SAFE_INTEGER guard for the text path — a 19-digit order number is
    reported today as number, settled, 100 % readable and loses its last
    digits when story 6 converts it. Story 4 already refuses the same defect
    for Parquet INT64 from the other side (C-10); one rule in typing.js next
    to hasLeadingZero covers both entries, and the column stays text, for the
    same reason a leading zero keeps one. (2) datetime from text — ISO with T,
    ISO with a space, Z and numeric offsets, and dd.MM.yyyy HH:mm. AD-21
    already holds the representation, so this is candidates, not
    architecture. (3) time from text, which is the one piece that opens the
    architecture: AD-21 knows date and datetime only, and a clock time with no
    date needs a third representation — nanoseconds since midnight, held as a
    BigInt like the other three — added to it. It also carries a real
    ambiguity, clock time against duration: a
    duration sums and passes 24:00, a clock time does not, and 36:15 settles
    the column while 08:15 does not. That is story 3's unresolved machinery,
    used for what it was built for, not a default picked quietly. (4) boolean
    from text — true/false, ja/nein, 1/0. The 1/0 form needs a rule, because
    it is also a perfectly good number. (5) Numbers carrying an affix, percent
    and currency. There is no detection ambiguity here: % and € are decisive
    markers competing with no second reading, exactly like a leading zero, and
    the number in front carries only the ordinary de/en question. What was
    open was storage, and it is decided — the affix is split off, the number
    stored is the number in the field (12,5 for "12,5 %", never 0,125), the
    affix rides on the column record as a property, and export writes it back.
    A column mixing € and $ is text plus a warning, not a question anyone can
    answer. (6) Accounting signs, (1.234,56) and 1.234,56-, the same parser
    branch as (5) and the one place here that can produce a wrong number
    rather than no number: strip the parentheses without carrying the sign and
    the value flips. Both are SAP and bookkeeping exports. Two-digit years
    (31.12.25) ride along with (2) and need a century rule stated in the spec,
    not chosen in code. Deliberately out, all recorded in deferred-work.md
    with reasons: a space as grouping separator (waits on a real Source),
    month names, exponential notation, ISO weeks and quarters, and integer as
    a type distinct from number.
- id: "4b"
  title: Month names in dates, German and English
  description: >-
    CAP-9 remainder: a date written with a month name is read rather than left
    as text. The Source that opened the gate is a Microsoft 365 security export
    carrying "2. Aug. 2026" and "31. Juli 2026"; English is in scope from the
    start because the same portals ship both.
  spec_checkpoint: true
  invoke_dev_with: >-
    Story 4a cut month names with the reason typing.js already states — a
    calendar per language, and no Source seen so far carried one. The Source
    now exists, which is the exact rule NUMBER_LOCALES follows, so this is the
    gate opening rather than a rule being broken. Four things are measured and
    should not be rediscovered. (1) The format is not an oddity:
    Intl.DateTimeFormat('de-DE', {day:'numeric', month:'short', year:'numeric'})
    reproduces both owner values byte for byte, so it is the browser's own
    German short date. (2) It is also not a mixture — CLDR abbreviates only the
    long month names, so Jan. Feb. Apr. Aug. Sept. Okt. Nov. Dez. carry a point
    and Maerz Mai Juni Juli stand in full without one. Sept. has four letters,
    so a three-letter rule is wrong. (3) The month table must be derived from
    Intl in the FORMAT context, via formatToParts of a whole date, not from
    {month:'short'} alone — standalone yields Aug and Jul, in a date the same
    option yields Aug. and Juli, and a table built the easy way misses exactly
    the owner's values. Measured 2026-08-03, that example understates it
    badly: in German short ELEVEN of the twelve entries differ between the two
    contexts and only Mai coincides, so the easy table is not slightly wrong at
    two entries, it is wrong nearly everywhere. That derivation is the same
    discipline numberCandidates
    already applies through Intl.NumberFormat, and it is what keeps a
    hand-written list from being wrong about a language nobody on the team
    speaks. (4) Adding English costs a second vocabulary and a second ordering
    but NO new ambiguity, which is the point worth checking before designing
    for one: de writes "2. Aug. 2026", en-US "Aug 2, 2026", en-GB "2 Aug 2026",
    and the month name's position identifies the shape inside every single
    value — no value parses under two orderings and yields two different dates.
    Where the two languages spell a month the same (April, August, September,
    November in full), they also mean the same month, so it is the case
    typing.js already refuses to ask about: an ambiguity between readings that
    mean the same thing is not an ambiguity. That argues for ONE candidate over
    the union of both vocabularies and all three orderings rather than a
    reading select nobody can answer, and it is now computed rather than
    assumed: 34 distinct normalized spellings across the three locales, ZERO of
    which mean two different months. The union is unambiguous, so the reading
    select stays out. The two questions this story held open for its spec are
    answered by the spike in
    planning-artifacts/spikes/intl-month-names-2026-08-03 and should not be
    reopened. (a) A set of accepted spellings per month beats one exact string,
    and the deciding evidence is not drift at all: en-US abbreviates September
    to Sep and en-GB to Sept, so both spellings the drift question feared an
    ICU update might swap between are ALREADY in scope today, in every engine
    measured, next to German Sept. The design follows from the locales this
    story already carries — which also means the CLDR release history that
    would otherwise have had to be researched is not needed: drift stays
    unproven either way and no longer blocks anything. (b) Intl emits no
    English ordinal suffix, over 2016 rendered values per engine, so
    Aug 2nd, 2026 cannot come from a derived table and accepting it means
    adding a rule Intl will never justify. Whether to accept it is this spec's
    call; the spike deliberately does not make it. Two things the spike settled
    that nobody asked: it is THREE engines, not two — AD-27 puts core/ under
    Vitest with environment: 'node' and typing.js lives in core/, so Node's ICU
    is what the unit tests see, and a Node-against-browser disagreement is a
    green test over a broken product. Node 26.5.1 (ICU 78.3), Chromium 151 and
    Firefox 153 agree on all 72 cells today. And the measured table belongs in
    the suite as a FROZEN fixture, the same move the xlsx spike's workbook
    makes for TableWriter: runtime derivation follows the engine, which is
    right, and the frozen copy is what turns a future ICU change into a failing
    test instead of a column that silently falls back to text. Month spellings
    are transliterated in this file, which carries no umlauts; the exact bytes
    are in the spike's measurements.json. Story 4a's width strictness does
    not bind here and the spec should say so: it exists so two NUMERIC patterns
    cannot agree on the values that distinguish them, and a month name has no
    competing pattern, so a one- or two-digit day is safe.
- id: "5"
  title: Step graph model and Editor
  description: >-
    CAP-11, CAP-12: deliberate Editor entry, a DAG of named Steps with one
    Result Step, cycle refusal with a named reason, broken and orphan Steps
    marked, keyboard-editable. Establishes named commands and the GraphView
    port with the Vue Flow adapter.
  invoke_dev_with: >-
    All mutation goes through named commands; the cycle guard runs in the
    command path before the editor library sees the edge — Vue Flow ships no
    cycle detection (AD-10). The graph model holds ids, never data (AD-6).
    Connect-by-keyboard is an open UX question in SPEC.md — leave the gap
    named rather than inventing a scheme silently.
- id: "6"
  title: Execution walking skeleton — engine adapter, Filter and Columns Steps
  description: >-
    CAP-15, CAP-16, CAP-19: first end-to-end execution of a linear pipeline —
    the TableEngine port with the Arquero adapter, the Filter and
    Select/Rename/Reorder Step kinds, and a per-Step preview carrying counts
    and warnings.
  spec_checkpoint: true
  invoke_dev_with: >-
    A Step is a pure sync function receiving the engine as a parameter (AD-4);
    a Table handle crosses boundaries and rows() materializes only at real
    edges (AD-5). Arquero 8.0.3 pinned and vendored; the adapter absorbs the
    measured hazards, Step kinds never do (AD-19, AD-22). Filter comparison
    values live in canonical machine form and type disagreement is refused
    (CAP-15). This story also owns the conversion story 3 deliberately left
    open: story 3 settles what a column *is* — type, locale, missing tokens,
    confirmed per Source — and holds only the raw text, because the entry's
    table is what the preview renders and what the damage report reads, so
    converted values cannot replace it in place. Applying a confirmed mapping
    therefore happens on the way into a Table here: unparsed values become
    boxes carrying their original text (AD-22), dates normalize to
    UTC-midnight epoch nanoseconds held as a BigInt — one unit for all four
    temporal types (AD-21) — and where that converted copy lives — and
    what it costs against R4/D2's 80.2 MB per 100k x 20 — is a Table question
    answered here, not a typing question answered there. With the boxes come
    the rows behind the number: story 3's panel says "842 von 900 Werten
    lesbar" and cannot show *which* 58 failed, because finding them again
    would be a second scan whose result this story immediately replaces. Once
    a value is a box carrying its original text, marking those cells in the
    preview is a render, not a search — and the count stops being a dead end.
    One conversion hazard is named here rather than left to be discovered:
    story 4a's datetime candidates accept end-of-day `24:00`, on all four of
    them, because ISO 8601 permits it — `2025-12-31T24:00:00Z`,
    `2025-12-31 24:00`, `31.12.2025 24:00` and `31.12.25 24:00` all read. What
    `24:00` means is **the next calendar day**: `2025-12-31T24:00:00Z` is
    `2026-01-01T00:00Z`, and on 31 December it is also the next year. A
    conversion that reads the date part and the hour independently — parse the
    date, add hours*3600e9 — is off by exactly one day on every value this
    admits, and the values it admits are the ones nothing else in the column
    distinguishes, so the error is invisible in the counts. The hour `24` is
    accepted only where minutes, seconds and any fraction are all zero, so the
    rollover is always to midnight and never to anything else.
- id: "7"
  title: Execution full build — cache, cancellation, execution modes
  description: >-
    CAP-38: content-addressed per-Step cache that replays diagnostics,
    cancellation between Steps, and the live/explicit mode switch at a stated
    row threshold with the mode in force always visible.
  invoke_dev_with: >-
    Cache key per AD-8 — key(source) = hash(byteDigest + parseConfig), never
    the Source id; entries store table and diagnostics together and a hit
    replays them. Cancellation only between Steps; SharedArrayBuffer is hidden
    from file:// and typeof lies about it (AD-9). The mode is scheduler state
    the UI reads, never decides (AD-29).
- id: "8"
  title: Union and Join Steps
  description: >-
    CAP-13, CAP-14: union with explicit column mapping where partial columns
    are listed before the Step runs, and join reporting unmatched left rows,
    row-count growth with its factor, explicit null-key handling and the
    duplicate audit.
  invoke_dev_with: >-
    The adapter reports null-key counts and refuses the sentinel fix —
    measured at 28k source rows exploding to 2.69M join rows (AD-19). Union
    computes an explicit column union first. Row-range chunking is forbidden
    for Union, Join and Aggregate (AD-9).
- id: "9"
  title: Computed column and Aggregate Steps
  description: >-
    CAP-17, CAP-18: computed columns from fixed operation lists as plain data
    (no free text to parse), and aggregation where null groups stay visible
    and input/output row counts are reported.
  invoke_dev_with: >-
    Division by zero and boxed inputs yield a marked empty cell through the
    adapter's box handling — never a crash, never a silent zero (AD-22). No
    chunking for Aggregate (AD-9).
- id: "10"
  title: Result table at design scale
  description: >-
    CAP-31: the Result as a windowed table smooth at 100k rows, headers fixed,
    German display conventions regardless of read locale, unparsed cells
    visually marked.
  invoke_dev_with: >-
    Clamp the spacer below the engine scroll-extent limit — Firefox collapses
    it to zero at ~614k rows at 28 px — and page beyond the clamp; the guard
    ships regardless of Firefox's fate (AD-24). Display locale is rendering
    only and never reaches a Table or Recipe (AD-21). The mechanism exists:
    core/view/row-window.js and ui/RowWindow.vue were built in story 2 to be
    adopted here. Adopting them means paying three debts story 2 left, all
    recorded in deferred-work.md. The component carries the Source story's
    vocabulary — test ids preview/preview-row/preview-pages and the default
    label Tabellenvorschau — so a page-scoped getByTestId('preview') will
    match both tables once both render; give the ids a per-consumer prefix.
    Its viewport is VIEWPORT_ROWS = 10 hardcoded, and a Result table wants a
    pane-filling grid: make the height a prop, and keep the invariant that the
    container stays under WINDOW_SIZE rows, or a blank band appears below the
    window (the e2e assertion on clientHeight must move with it). The paging
    branch is covered since 2026-08-02 by ui/RowWindow.test.js in the ui/
    Vitest envelope (AD-27, R10) — a props-only fake table, since happy-dom
    has no layout; extend that file rather than reaching for a fixture.
- id: "11"
  title: View filter, sort, promotion and full-dataset search
  description: >-
    CAP-32, CAP-33: transient view filters and sorting over the full Result,
    announced as a view, promotable into a Filter Step in one action; search
    over every row with match count and jump navigation.
  invoke_dev_with: >-
    The view predicate lives in core/ so promotion is the same value, not a
    re-expression (AD-24). Search runs over the data, not the DOM (CAP-33).
- id: "12"
  title: Run status
  description: >-
    CAP-34: a run status distinguishing warned runs from clean ones at a
    glance, aggregating every Step warning. The Pre-flight and repair facets
    land with stories 15 and 17; until then their absence is rendered
    honestly, not implied clean.
  invoke_dev_with: >-
    The status is pure aggregation of the AD-13 diagnostic stream and adds
    nothing of its own; severity includes 'unresolved' for states awaiting a
    person. It carries the run id and timestamp from the Clock port (AD-25).
- id: "13"
  title: "Data export — milestone: reports in, consolidated table out"
  description: >-
    CAP-36: export the Result as CSV, JSON, XLSX and Parquet in German
    conventions with progress and no frozen interface. Closes the
    PowerQuery-replacing path.
  done_checkpoint: true
  invoke_dev_with: >-
    Follow spike xlsx-german-format-2026-08-02: locale-neutral format codes
    (#,##0.00 / dd.mm.yyyy), never German-looking codes, never the [$-407]
    prefix. write-excel-file 4.1.1 has no filePath — use toBuffer. Workers
    exist for XLSX and Parquet export only: classic script from a blob URL,
    ?worker&inline, format iife (AD-15). CSV gets a BOM and semicolon default;
    never send a dataset to a worker to compute on it.
- id: "14"
  title: Recipe save and load
  description: >-
    CAP-20: the Recipe as a versioned, data-free file carrying Steps,
    configurations, confirmations, annotations, Dashboard and Input Contract,
    refused on unknown version. Establishes the canonical serializer and the
    one validator all three doors will share.
  spec_checkpoint: true
  invoke_dev_with: >-
    One canonical serializer with fixed key order serves both the file and the
    cache-key hash; byte-identical round trip is a test (conventions, AD-8).
    Unrecognised fields are refused, not ignored (AD-11); a version mismatch
    names both versions (AD-12). Ids are short readable strings, no UUIDs
    (AD-14). C-13: a linear pipeline must be the trivial case of the format.
    This story is also where user content that outlives a column gets a home.
    Story 3 carries a column's annotation across a re-read by name — the only
    thing a re-read preserves — so a header-row correction that renames the
    column drops the sentence someone wrote, and correcting the header back
    does not return it, because only the current typing is retained. Once a
    Recipe holds confirmations and annotations off to one side of the live
    entry, the orphan has somewhere to wait and a rule for when it expires.
    Deciding that here is fitting it to a store that exists; deciding it in
    story 3 would have been inventing a second one.
    Six things story 4a added must round-trip, and an older Recipe will lack
    every one of them, so the loader needs a stated answer per field rather
    than a default that looks harmless. A column record now carries `affix`
    (the `%`, `€` or `$` a number column rides on — story 13 writes it back on
    export, so losing it changes exported values), `mixedAffixes` (the
    two-units finding; a proposal-time fact, absent once a user has chosen a
    type, so a missing key and an empty list are not the same state) and
    `mixedBooleanPairs` (its sibling — the two-pairs finding, same shape, same
    absent-once-chosen rule; it is a fifth record field and was missed on the
    first count of this list). A
    verdict's `evidence` now carries `over: 'kind'` where the alternatives are
    type codes rather than readings — `[time, duration]` or `[date, text]` —
    and `core/exec/source-store.js` reads it through `?.` precisely because a
    restored typing may not have it; without it a restored ambiguity points the
    card at the wrong control. A stored `chosen` may now be
    `{ type: 'date', format: null }` — a legal state, not a missing field: the
    user answered the kind question and was never asked the reading one, so
    `null` means "no reading chosen" for every type rather than only for the
    three that have no readings. Restoring it is `setColumnTyping(id, i,
    chosen)` and the column comes back `unresolved` over the reading, which is
    where it was; a loader that treated the `null` as absent and re-proposed a
    best reading would answer for the user the question the record exists to
    keep open. And AD-21's temporal columns are epoch
    nanoseconds held as `BigInt`, which JSON cannot express at all: the
    encoding is this story's to fix, and `JSON.stringify` throws on a `BigInt`
    rather than rounding it, so the failure is loud but only if a test reaches
    it. `core/exec/source-store.js` exports `typingDiagnostics` so a typing
    this store did not build can be projected and checked directly.
- id: "15"
  title: Input Contract, Pre-flight Check and column mapping
  description: >-
    CAP-21, CAP-22, CAP-23: derive a contract covering only the columns the
    Pipeline reads, validate loaded files against it before any Step runs with
    fits/missing/doubtful verdicts, and map the Consumer's real columns onto
    unmet requirements, savable back into the Recipe.
  invoke_dev_with: >-
    'Doubtful' is severity 'unresolved', not a warning (AD-13). The Pre-flight
    gate lives in the scheduler next to the type gate — no caller can reach
    execution around it (AD-29). Mapping goes through the mapContractColumn
    command (AD-10).
- id: "16"
  title: Session persistence and deletion
  description: >-
    CAP-25: Recipe and Source data survive closing the tool via the
    SessionStore port over IndexedDB, one obvious action deletes everything, a
    partial restore says so and offers a clean start.
  invoke_dev_with: >-
    Never await navigator.storage.persist() unguarded — it never settles on
    Firefox file:// and deadlocked a probe for 180 s (AD-16). Namespacing
    makes collisions legible but isolates nothing; no interface text may imply
    isolation, and the rule is untestable under Playwright's Firefox (AD-16).
- id: "17"
  title: JSON and NDJSON Sources with repair and structure view
  description: >-
    CAP-1 (JSON/NDJSON scope), CAP-4, CAP-5, CAP-6, CAP-7, CAP-8 (structure
    view): strict-parse detection of malformed JSON, user-triggered repair
    with disclosed diff, explicit three-option array flattening stored in the
    Recipe, and the collapsible structure view in the preview.
  invoke_dev_with: >-
    Repair only on user action via jsonrepair; the file on disk is never
    modified and a failed repair leaves the Source unloaded (CAP-5). The
    repair fact travels into the run status (CAP-6, AD-13). Re-flattening
    re-reads the retained bytes (AD-7) and re-parses under a new cache key
    (AD-8).
- id: "18"
  title: Column Profile and prompt block
  description: >-
    CAP-26, CAP-27: a structural profile of the loaded Sources with no cell
    values, shown in full before use, and a one-action copy block carrying
    question, profile, current Pipeline and both format specifications.
  invoke_dev_with: >-
    Everything that may leave is assembled in core/profile into one Disclosure
    value, and the Clipboard port accepts nothing else — no second path out
    (AD-23, NFR-8).
- id: "19"
  title: Accept a model's Recipe
  description: >-
    CAP-28: paste a model's answer, validate it through the same validator as
    file and Editor, refuse with text specific enough to paste back, and load
    a valid Recipe as inspectable Steps without silently replacing the
    Pipeline.
  invoke_dev_with: >-
    One validator, three doors (AD-11) — this story adds a door, not a
    validator. The refusal text is machine-facing prose from core/recipe, the
    sole exception to codes-only (AD-11, AD-13). Coercion is by named rule:
    canonical numeric strings coerce; grouping separators, decimal commas,
    non-ISO dates and type disagreements are refused naming the character or
    both types (CAP-28).
- id: "20"
  title: Probe Query and explicit sample release
  description: >-
    CAP-29, CAP-30: run a model-authored query locally in the Step vocabulary
    with its result shown before any return, and release sample values per
    column per exchange, off by default and never persisted into the Recipe.
  invoke_dev_with: >-
    A Probe Query introduces no second query language and is validated on
    exactly CAP-28's terms, unrecognised fields refused (AD-11). Its result
    and released samples flow through the same single Disclosure value
    (AD-23). A Consumer never inherits an Author's disclosure decision
    (CAP-30).
- id: "21"
  title: Dashboard from Tiles
  description: >-
    CAP-35: add, configure, order and size Tiles over the Result through one
    small form on a fixed grid with keyboard-reachable ordering; the Dashboard
    definition is stored in the Recipe.
  invoke_dev_with: >-
    Register ECharts' SVG renderer alone — with both registered, SVG requests
    silently return PNG (AD-26). Every tile sets a long-label strategy and a
    max bar width; resize is explicit, the renderer observes nothing (AD-26).
    Tiles are edited only through the configureTile command (AD-10).
- id: "22"
  title: Package export and import
  description: >-
    CAP-24: bundle a Recipe with its Source data into one compressed file,
    visibly distinct from a Recipe, size stated before writing, importing
    nothing on read failure. The container format is an open question in
    SPEC.md — expect a spike before committing.
  spec_checkpoint: true
  invoke_dev_with: >-
    R9 answered only the IndexedDB gate; whether the container is a zip and
    whether data rides as Parquet inside is undecided — and whether
    compressing 500k rows stays responsive is unmeasured. The Package embeds
    the retained original bytes of AD-7 and respects AD-16's namespacing.
- id: "23"
  title: View document export
  description: >-
    CAP-37: a self-contained static HTML document and a paginated PDF carrying
    Result, Dashboard, run status and run identity, with vector charts whose
    labels are selectable text. R8 is written and unrun — run or decide it
    first; library vs print-to-PDF is the open question.
  spec_checkpoint: true
  invoke_dev_with: >-
    ports/DocumentWriter is defined and deliberately unimplemented (AD-28) —
    bind to it, not to TableWriter. Charts stay vector with real text (AD-26);
    the document names Recipe, date, Sources and run status with AD-25's run
    identity, and must open with no network access (AD-17).
